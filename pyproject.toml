[project]
name = "repo-control"
version = "0.1.0"
description = "Totem-implied repo: div-agnostic repo control and structural bad-curve detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
benchmark = ["scikit-learn>=1.3"]
report = ["matplotlib>=3.7", "reportlab>=4.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["repo_control"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
